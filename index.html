:root {

  --road-hi: #aeb6b2;   /* motorways at country zoom */
  --road-case: #c3cac6;
  --rail: #9aa39e;
  --halo: #eef1ef;      /* label halo */
  --ink: #1c2320;
  --ink-2: #56605b;
  --ink-3: #8a938e;
  --line: #e4e8e6;
  --seg-sintered_slab: #6b5bd2;
  --seg-italian_premium: #c0582b;
  --seg-spanish_design: #b08a1e;
  --seg-turkish: #c2335a;
  --seg-na_mass: #2d7fc1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {

    --accent: #4CC38A;

    --bg: #111513;
    --water: #161b19;

    --ink-3: #7c8580;

    color-scheme: dark;
  }
}
